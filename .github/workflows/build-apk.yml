name: Build KALINGA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web App
        run: |
          npm install
          npm run build

      - name: Configure Capacitor & Android Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          cat << 'EOF' > capacitor.config.ts
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'ph.kalinga.app',
            appName: 'KALINGA',
            webDir: 'dist',
            server: {
              androidScheme: 'https',
              cleartext: true
            },
            android: {
              allowMixedContent: true
            }
          };

          export default config;
          EOF
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload KALINGA APK
        uses: actions/upload-artifact@v4
        with:
          name: kalinga-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
