name: Build KALINGA Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Web App & Android APK
        run: |
          PKG_FILE=$(find . -maxdepth 4 -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_FILE" ]; then
            echo "ERROR: No package.json found in repository!"
            exit 1
          fi
          APP_DIR=$(dirname "$PKG_FILE")
          echo "Using project directory: $APP_DIR"
          cd "$APP_DIR"

          rm -f package-lock.json yarn.lock pnpm-lock.yaml
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            for (const section of ["dependencies", "devDependencies"]) {
              if (pkg[section] && pkg[section].esbuild) {
                pkg[section].esbuild = "^0.28.2";
              }
            }
            pkg.overrides = { ...(pkg.overrides || {}), "esbuild": "^0.28.2" };
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2));
          '

          npm install --no-audit --no-fund --legacy-peer-deps || npm install --no-audit --no-fund --force
          npm run build || npx --yes vite build

          WEB_DIR="dist"
          [ -d "build" ] && [ ! -d "dist" ] && WEB_DIR="build"

          npm install --no-audit --no-fund --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

          cat << EOF > capacitor.config.ts
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'ph.kalinga.app',
            appName: 'KALINGA',
            webDir: '$WEB_DIR',
            server: {
              androidScheme: 'https',
              cleartext: true
            },
            android: {
              allowMixedContent: true
            }
          };
          EOF

          [ ! -d "android" ] && npx cap add android
          npx cap sync android

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload KALINGA APK
        uses: actions/upload-artifact@v4
        with:
          name: kalinga-app-debug
          path: "**/android/app/build/outputs/apk/debug/app-debug.apk"
